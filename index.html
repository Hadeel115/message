<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة إلك 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<!-- المنصة: الظرف دايماً بنص الشاشة -->
<main class="stage">
  <div class="aura" aria-hidden="true"></div>

  <button class="envelope" id="env" aria-label="افتح الظرف">
    <div class="back"></div>

    <!-- ✏️ هون بتغيّر نص الرسالة -->
    <div class="letter">
      <h2 class="line" style="--i:0">عزيزي المشترك حمودتي ❤️
</h2>
      <p class="line" style="--i:1">نود إعلامكم بأنه تم رصد انخفاض حاد في مستوى المكالمات والاهتمام🚨
</p>
      <p class="line" style="--i:2">لتفادي النكد المسائي يرجى إرسال: «بحبك يا روحي» 💌</p>
      <p class="line" style="--i:3">اتمنى لك السعادة الدائمة معي وشكرا ❤️</p>
    </div>

    <div class="front">
      <svg viewBox="0 0 314 204" preserveAspectRatio="none">
        <path d="M0 204 L157 105" fill="none" stroke="#e5173f" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,40,70,.9))"/>
        <path d="M314 204 L157 105" fill="none" stroke="#e5173f" stroke-width="2.5" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,40,70,.9))"/>
      </svg>
    </div>

    <div class="flap">
      <svg viewBox="0 0 314 112" preserveAspectRatio="none">
        <path d="M1.5 1.5 H312.5 L157 108 Z" fill="#fff" stroke="#e5173f" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="seal">
      <svg viewBox="0 0 24 24"><path fill="#e5173f" stroke="#fff" stroke-width="1.2" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
  </button>

  <p class="hint" id="hint">افتح الظرف</p>
</main>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
